[simulation]
description = "Test input file for batch chem demo driver, using constraints defined in crunchflow's native input file."
timestep = 2592000  # 30 days
max_steps = 60

[state]
density = 997.07511766644416
porosity = 0.5
temperature = 25.0
pressure = 101325.0

[material]
volume = 1.0
saturation = 1.0

[chemistry]
engine = CrunchFlow
input_file = calcite-vf-crunch.in
initial_condition = driver_ic

[condition:driver_ic]
HCO3- = aqueous_constraint(1.00293346236581e-2, total_aqueous)
Ca++ = aqueous_constraint(1.00293346236581e-19, total_aqueous)
H+ = aqueous_constraint(1.00293346236581e-2, total_aqueous)
Calcite = mineral_constraint(0.2, 100.0)

[output]
verbose = true
type = gnuplot
