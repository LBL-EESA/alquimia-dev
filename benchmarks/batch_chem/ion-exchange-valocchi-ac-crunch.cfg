[simulation]
description = "Test input file for batch chem driver, using constraints defined by Alquimia"
timestep = 31557600 # 1 year
max_steps = 1

[state]
density = 997.07511766644416
porosity = 0.5
temperature = 25.0
pressure = 101325.0
cation_exchange_capacity = 750.0

[material]
volume = 1.0
saturation = 1.0

[chemistry]
engine = CrunchFlow
input_file = ion-exchange-valocchi-crunch.in
initial_condition = driver_ic

[condition:driver_ic]
Na+ = aqueous_constraint(8.65e-2, total_aqueous)
Ca++ = aqueous_constraint(1.82e-2, total_aqueous)
Mg++ = aqueous_constraint(1.11e-2, total_aqueous)
Cl- = aqueous_constraint(2.0e-3, charge)
Halite = mineral_constraint(1.0e-5, 1.0)

[output]
verbose = true
type = gnuplot
