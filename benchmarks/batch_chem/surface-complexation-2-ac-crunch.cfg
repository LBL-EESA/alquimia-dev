[simulation]
description = "Test surface complexation from batch chem driver, using crunchflow native constraints."
timestep = 31557600 # 1 year
max_steps = 1

[state]
density = 997.07511766644416
porosity = 0.9
temperature = 25.0
pressure = 101325.0
surface_site_density[>FeOH_w] = 7.6355e-1
surface_site_density[>FeOH_s] = 1.908e-2

[material]
volume = 1.0
saturation = 1.0

[chemistry]
engine = CrunchFlow
input_file = surface-complexation-2-crunch.in
initial_condition = driver_ic

[condition:driver_ic]
H+ = aqueous_constraint(6.0, pH)
Cl- = aqueous_constraint(1.0e-5, mineral, Halite)
Na+ = aqueous_constraint(1.0e-5, charge)
Zn++ = aqueous_constraint(1.0e-6, total_aqueous)
NO3- = aqueous_constraint(1.0e-1, total_aqueous)
Halite = mineral_constraint(1.e-5, 1.0)

[output]
verbose = true
type = gnuplot
